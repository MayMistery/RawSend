<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#a8d8ff"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#4fc3f7;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  
  <!-- macOS squircle shape -->
  <rect x="12" y="12" width="488" height="488" rx="110" ry="110" fill="url(#bg)"/>
  
  <!-- Subtle inner glow -->
  <rect x="12" y="12" width="488" height="488" rx="110" ry="110" fill="none" stroke="#4fc3f7" stroke-opacity="0.15" stroke-width="2"/>
  
  <!-- Motion trail lines -->
  <line x1="100" y1="320" x2="220" y2="260" stroke="url(#trailGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="350" x2="200" y2="310" stroke="url(#trailGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="140" y1="375" x2="210" y2="345" stroke="url(#trailGrad)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Paper plane - main body -->
  <polygon points="380,140 160,240 220,270 380,140" fill="url(#planeGrad)" opacity="0.95"/>
  <polygon points="380,140 220,270 250,340 380,140" fill="#a8d8ff" opacity="0.85"/>
  <polygon points="220,270 250,340 240,285" fill="#7bb8e0" opacity="0.7"/>
  
  <!-- Code/request symbols "{ }" -->
  <text x="130" y="440" font-family="SF Mono, Menlo, monospace" font-size="48" font-weight="bold" fill="#4fc3f7" opacity="0.7">{</text>
  <text x="350" y="440" font-family="SF Mono, Menlo, monospace" font-size="48" font-weight="bold" fill="#4fc3f7" opacity="0.7">}</text>
  
  <!-- Small arrow/send indicator -->
  <polygon points="240,420 280,410 270,430" fill="#4fc3f7" opacity="0.5"/>
  
  <!-- HTTP text hint -->
  <text x="195" y="435" font-family="SF Mono, Menlo, monospace" font-size="28" font-weight="bold" fill="#4fc3f7" opacity="0.55">HTTP</text>
</svg>
